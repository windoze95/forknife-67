#cloud-config
# Droplet bootstrap for forknife-67.
#
# Runs once on first boot. Everything here is idempotent so re-running the
# script by hand is safe. Deliberately minimal: Node, nginx, certbot, a
# systemd unit and a firewall. No database, no npm install.

package_update: true
package_upgrade: true

packages:
  - nginx
  - curl
  - ca-certificates
  - gnupg
  - ufw
  - unattended-upgrades
  - rsync

users:
  - name: forknife
    system: true
    shell: /usr/sbin/nologin
    home: /opt/forknife67
    create_home: false

write_files:
  - path: /etc/systemd/system/forknife67.service
    permissions: '0644'
    content: |
      [Unit]
      Description=forknife 67 sprite tracker
      Documentation=https://github.com/windoze95/forknife-67
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=forknife
      Group=forknife
      WorkingDirectory=/opt/forknife67/app
      Environment=NODE_ENV=production
      Environment=PORT=8080
      Environment=HOST=127.0.0.1
      Environment=DATA_DIR=/var/lib/forknife67
      Environment=TRUST_PROXY=1
      ExecStart=/usr/bin/node server/server.js
      Restart=always
      RestartSec=2

      # The process only ever needs to read its own code and write one data dir.
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/var/lib/forknife67
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectControlGroups=true
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
      RestrictNamespaces=true
      LockPersonality=true
      MemoryMax=300M

      [Install]
      WantedBy=multi-user.target

  - path: /etc/nginx/sites-available/forknife67
    permissions: '0644'
    content: |
      # Pre-TLS config. deploy.sh rewrites this once certbot has a cert.
      server {
          listen 80;
          listen [::]:80;
          server_name _;

          location /.well-known/acme-challenge/ { root /var/www/html; }

          location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # Node 22 from NodeSource — Ubuntu's own package is too old for node:test.
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs
  - snap install --classic certbot || apt-get install -y certbot
  - ln -sf /snap/bin/certbot /usr/bin/certbot || true
  - snap set certbot trust-plugin-with-root=ok || true
  - snap install certbot-dns-cloudflare || apt-get install -y python3-certbot-dns-cloudflare

  - mkdir -p /opt/forknife67/app /var/lib/forknife67
  - chown -R forknife:forknife /var/lib/forknife67
  - chmod 750 /var/lib/forknife67

  - rm -f /etc/nginx/sites-enabled/default
  - ln -sf /etc/nginx/sites-available/forknife67 /etc/nginx/sites-enabled/forknife67
  - nginx -t && systemctl reload nginx

  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  - systemctl daemon-reload
  - systemctl enable forknife67
  - touch /var/lib/cloud/forknife-ready
