# Watches for Fortnite moving on without us.
#
# It files an issue; it never edits the catalog. The catalog ships inside the
# app so the app works with no signal, and a scraper writing to it unreviewed
# would publish whatever a wiki edit or a changed page layout produced — to
# someone with no way to notice it was wrong.
name: Catalog drift

on:
  schedule:
    # Daily, a little after Fortnite's usual patch window.
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check the catalog against the live game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Look for drift
        id: drift
        run: |
          set +e
          node tools/check-catalog-drift.js > report.txt 2>&1
          code=$?
          set -e
          # Capture the status before anything else can clobber $?.
          if [ "$code" -eq 0 ]; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi
          cat report.txt

      - name: Open or update an issue
        if: steps.drift.outputs.drifted == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const title = 'Sprite catalog is behind the live game';

            const body = [
              'The daily check found sprites or totals the catalog does not account for.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              '### To fix',
              '',
              'The hard data — drop rates, dust costs, exact in-game strings and artwork —',
              'lives in the game files, mirrored by fortnite.gg, which refuses both plain',
              'fetches and headless browsers. So this part needs a real browser or a',
              'scraping service:',
              '',
              '1. Add the new entries to `public/lib/catalog.js`.',
              '2. `node tools/fetch-sprite-art.js` to pull the artwork.',
              '3. Move the pinned counts at the top of `test/catalog.test.js`.',
              '4. `npm test` — the catalog tests fail until the counts match.',
              '',
              '_Raised automatically; this check never edits the catalog itself._',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'catalog-drift',
            });

            // One issue, updated — a new one every morning would be noise.
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Still drifting as of ${new Date().toISOString().slice(0, 10)}.\n\n\`\`\`\n${report.trim()}\n\`\`\``,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['catalog-drift'],
              });
            }
