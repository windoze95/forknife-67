# Read-only watchdog: report catalog drift or lost source coverage for review.
name: Catalog drift

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the catalog against the live game
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check build and complete current-season roster
        id: drift
        run: |
          set +e
          node tools/check-catalog-drift.js --json > report.json 2> report-error.txt
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'JS' > report.txt
          import fs from 'node:fs';
          import { formatReport } from './tools/check-catalog-drift.js';
          try {
            console.log(formatReport(JSON.parse(fs.readFileSync('report.json', 'utf8'))));
          } catch {
            console.log('Catalog check could not produce a valid report.');
            console.log(fs.readFileSync('report-error.txt', 'utf8'));
          }
          JS
          cat report.txt
          cat report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the review issue
        if: steps.drift.outputs.exit_code != '0'
        uses: actions/github-script@v7
        env:
          CHECK_EXIT_CODE: ${{ steps.drift.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const incomplete = process.env.CHECK_EXIT_CODE !== '1';
            const title = incomplete
              ? 'Sprite catalog check cannot verify the live game'
              : 'Sprite catalog needs review against the live game';
            const body = [
              incomplete
                ? 'The daily check lost source coverage. This is not a successful catalog check.'
                : 'The daily check found a new patch, new sprites, or an overdue catalog verification.',
              '', '```', fs.readFileSync('report.txt', 'utf8').trim(), '```', '',
              '### To resolve', '',
              '1. Verify the current-season roster and release status at https://fortnite.gg/sprites.',
              '2. Update `public/lib/catalog.js` and the artwork mapping, then run `node tools/fetch-sprite-art.js`.',
              '3. Check the source parsers if coverage failed. Do not turn failures into successful empty results.',
              '4. Update the verified patch/date, pinned counts and offline cache version. Run unit and browser checks.',
              '', '_Raised automatically. This check never edits or deploys the catalog._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'catalog-drift', per_page: 100,
            });
            const issue = open.find(item => !item.pull_request);
            if (issue) {
              // Update one issue instead of posting another comment every day.
              if (issue.title !== title || issue.body !== body) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, title, body });
              }
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['catalog-drift'] });
            }

      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-drift-report
          path: report*
          retention-days: 30

      - name: Fail when drift or incomplete coverage needs attention
        if: steps.drift.outputs.exit_code != '0'
        run: exit 1
