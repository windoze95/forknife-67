name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys uploading assets at once would race for the same version. Queue
# instead, and never cancel one midway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Merging to main must never ship something the test suite rejects.
  test:
    name: Test before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run test:worker

  # Job-level `if:` cannot read secrets, so presence is resolved here and
  # passed down as an output. Without this, every merge would show a red X
  # until the secret is configured.
  preflight:
    name: Check deploy secret
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped — add the CLOUDFLARE_API_TOKEN repository secret to enable it. See README.md."
          fi

  deploy:
    name: Deploy to production
    needs: [test, preflight]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://forknife67.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Confirm the site is serving the new build
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "https://${{ vars.DOMAIN || 'forknife67.com' }}/api/health" | grep -q '"ok":true'; then
              echo "health check passed"
              exit 0
            fi
            echo "attempt $i failed, retrying…"
            sleep 10
          done
          echo "::error::Site did not return a healthy response after the deploy"
          exit 1
